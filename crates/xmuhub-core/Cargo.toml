[package]
name = "xmuhub-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
parking_lot = "0.12.5"
pinyin = "0.11.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
redb = "4.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = "0.26.2"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time", "fs", "io-util"] }
tracing = "0.1.44"
