[package]
name = "xmuhub-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "xmuhub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
brotli = "9.0.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "hostname", "rustls-platform-verifier", "aws-lc-rs"] }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = "0.1.52"
mime_guess = "2.0.5"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xmuhub-core = { version = "0.1.0", path = "../xmuhub-core" }
