# http context (/www/server/panel/vhost/nginx/ is included inside http {}).
# Static files don't count: one page view loads a dozen of them, mostly as 304s.
map $uri $xmuhub_req_key {
    ~^/(assets|vendor)/ "";
    default             $binary_remote_addr;
}
limit_req_zone $xmuhub_req_key zone=xmuhub_req:10m rate=10r/s;

# Who may talk to xmu.vintces.icu directly: Cloudflare (same ranges as set_real_ip_from in
# xmuhub-cloudflare.conf) and this machine (admin scripts use --resolve ...:127.0.0.1).
# $realip_remote_addr is the connecting address, before CF-Connecting-IP replaces it.
# Only the xmu vhost checks it; the other (DNS-only) sites on this box are untouched.
geo $realip_remote_addr $xmuhub_from_cf {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Timing log (enabled in xmuhub-cloudflare.conf): rt = whole request, ut = time in XMUHub,
# uc = time to connect to it. rt far above ut means the network or the client was slow;
# ut high means the app was (e.g. waiting for the database writer).
log_format xmuhub_timing '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                         'rt=$request_time ut=$upstream_response_time uc=$upstream_connect_time';
