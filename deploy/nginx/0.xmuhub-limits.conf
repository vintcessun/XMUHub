# http context (/www/server/panel/vhost/nginx/ is included inside http {}).
# Static files don't count: one page view loads a dozen of them, mostly as 304s.
map $uri $xmuhub_req_key {
    ~^/(assets|vendor)/ "";
    default             $binary_remote_addr;
}
limit_req_zone $xmuhub_req_key zone=xmuhub_req:10m rate=10r/s;

# Timing log (enabled in xmuhub-cloudflare.conf): rt = whole request, ut = time in XMUHub,
# uc = time to connect to it. rt far above ut means the network or the client was slow;
# ut high means the app was (e.g. waiting for the database writer).
log_format xmuhub_timing '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                         'rt=$request_time ut=$upstream_response_time uc=$upstream_connect_time';
