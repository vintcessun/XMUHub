<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站外资源 · {{site.name}}</title>
<meta name="description" content="{{site.description}}">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{site.logo}}">
<link rel="apple-touch-icon" href="{{site.logo}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="{{site.background}}" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="links">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t){document.getElementById('top').innerHTML=t;document.documentElement.classList.add('seen')}}catch(e){}</script>
<main><div class="wrap" style="max-width:860px">
  <div class="page-head"><div><h1>站外资源</h1><div class="muted small">同学们整理在别处的资料：GitHub 仓库、网盘合集、公众号等。本站只收录链接，内容由各自的维护者负责，打开前请自行判断。</div></div></div>
  <div id="manage"></div>
  <section class="card"><div class="list" id="links"><div class="skeleton"></div></div></section>
  <section class="card" id="suggest"><h3>推荐一个</h3><p class="small muted" style="margin-top:0">知道好用的资料合集、网盘、GitHub 仓库？推荐给大家，审核员核实后会加到上面的列表里。请只推荐免费的学习资料，不要推荐广告、付费或需要加群的链接。</p><div id="sform"></div><div id="mine"></div></section>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/links.js"></script>
</body>
</html>
