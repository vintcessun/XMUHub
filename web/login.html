<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{site.name}}</title>
<meta name="description" content="{{site.description}}">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{site.logo}}">
<link rel="preload" href="{{site.background}}" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="me">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t){document.getElementById('top').innerHTML=t;document.documentElement.classList.add('seen')}}catch(e){}</script>
<main><div class="wrap">
  <section class="card auth-card">
    <div class="tabs" id="tabs"><button data-t="login" class="on">登录</button><button data-t="register">注册</button><button data-t="reset">找回密码</button></div>
    <form id="f" autocomplete="on">
      <label class="field"><span>邮箱</span><input class="input" id="email" type="email" autocomplete="email" required></label>
      <div id="codebox" hidden><label class="field"><span>邮箱验证码</span><div class="row" style="flex-wrap:nowrap"><input class="input" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn" id="sendcode" type="button" style="flex:none">获取验证码</button></div></label>
        <div id="captchabox" hidden style="margin:-4px 0 14px"><p class="small muted" style="margin:0 0 8px">这个邮箱不在常用邮箱之列，请先完成人机验证（通过后会自动发送验证码）。用 QQ、163、Gmail 或校园邮箱注册则不需要。</p><div id="captcha"></div></div></div>
      <div id="nickbox" hidden><label class="field"><span>昵称（仅审核员可见，可选择在自己上传的资料上公开；一个字也行）</span><input class="input" id="nickname" maxlength="20"></label></div>
      <label class="field"><span id="pwlabel">密码</span><input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <div id="pw2box" hidden><label class="field"><span>再次输入密码</span><input class="input" id="password2" type="password" autocomplete="new-password" minlength="8"></label></div>
      <label class="row small" id="consentbox" hidden style="gap:8px;align-items:flex-start;flex-wrap:nowrap;margin:0 0 14px"><input type="checkbox" id="consent" style="margin-top:3px"><span>我已阅读并同意<a href="/about" target="_blank">使用须知</a>和<a href="/privacy" target="_blank">隐私政策</a>，并单独同意本站将账号信息交由境外服务商（Cloudflare、GitHub）处理和备份（见<a href="/privacy#processors" target="_blank">委托处理与出境</a>）。</span></label>
      <div id="msg"></div>
      <button class="btn primary lg" id="go" style="width:100%">登录</button>
    </form>
    <p class="small muted" style="margin-top:14px">任何邮箱都可以注册；使用校园邮箱注册会显示「{{site.verified_label}}」。<b>部分资料仅对认证用户开放，建议使用学校的 edu 邮箱注册。</b></p>
  </section>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/login.js"></script>
</body>
</html>
