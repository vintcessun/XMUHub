<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分类 · 鹭岛书阁</title>
<meta name="description" content="鹭岛书阁是厦门大学学生资料共享平台，按课程整理的往年试卷、笔记、课件，免费下载与分享。">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/logo.png" type="image/png">
<link rel="preload" href="/assets/xmu-campus-background.jpg" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="browse">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t){document.getElementById('top').innerHTML=t;document.documentElement.classList.add('seen')}}catch(e){}</script>
<main><div class="wrap">
  <div class="page-head">
    <div><div class="crumbs" id="crumbs"></div><h1 id="name">加载中…</h1><div class="muted small" id="info"></div></div>
    <div class="row"><form class="row" action="/search" role="search" id="scoped" style="flex-wrap:nowrap"><input type="hidden" name="within" id="within"><input class="input" name="q" id="sq" placeholder="在这里搜索…" style="max-width:200px" aria-label="在本分类中搜索"></form>
      <a class="btn primary" id="upload" href="/upload">上传到这里</a></div>
  </div>
  <div id="editor" hidden></div>
  <div class="grid" id="children" style="margin-bottom:16px"></div>
  <div class="toolbar" id="bar" hidden><div class="chips" id="buckets"></div><span class="grow"></span><select id="time" aria-label="时间"><option value="">全部时间</option></select></div>
  <section class="card" id="rescard"><div class="list" id="list"><div class="skeleton"></div></div></section>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/node.js"></script>
</body>
</html>
