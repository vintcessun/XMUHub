<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资料 · {{site.name}}</title>
<meta name="description" content="{{site.description}}">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{site.logo}}">
<link rel="apple-touch-icon" href="{{site.logo}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="{{site.background}}" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="browse">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t){document.getElementById('top').innerHTML=t;document.documentElement.classList.add('seen')}}catch(e){}</script>
<main><div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div class="layout-side">
    <div class="stack">
    <section class="card">
      <h1 id="title" style="overflow-wrap:anywhere">加载中…</h1>
      <p id="subtitle" class="muted" style="margin:-4px 0 12px;overflow-wrap:anywhere" hidden></p>
      <div class="row small muted" id="tags" style="margin-bottom:14px"></div>
      <div id="notice"></div>
      <p id="note" class="muted" style="white-space:pre-wrap" hidden></p>
      <dl class="kv" id="kv"></dl>
    </section>
    <section class="card" id="pvcard"><div class="row"><h2 style="margin:0">在线预览</h2><span class="grow"></span><button class="btn sm" id="pvgo" type="button">加载预览</button></div>
      <div id="pv" style="margin-top:12px"><p class="small muted">支持 PDF、Word、PPT、Excel、OpenDocument、RTF、图片、音视频、文本代码、电子书和压缩包内文件。在线预览不计下载次数。</p></div></section>
    <section class="card" id="social">
      <div class="row"><h2 style="margin:0">评分</h2><span class="grow"></span><span id="ravg" class="small muted"></span></div>
      <div class="row" style="margin:10px 0 0"><span class="small">我的评分</span><span class="rate" id="rate"></span><span class="small faint" id="ratehint"></span></div>
    </section>
    <section class="card" id="history" hidden><h2>审核记录</h2><div id="hlist" class="small"></div></section>
    </div>
    <aside>
      <section class="card">
        <button class="btn primary lg" id="dl" style="width:100%">下载</button>
        <div class="progress" id="dlprog" hidden style="margin-top:12px"><i></i></div>
        <p class="small faint" style="margin:10px 0 0">文件由用户上传、存放在第三方平台，经国内公共加速镜像下载，本站服务器不存储、不转发文件。资料仅供个人学习，版权归原作者或权利人所有。</p>
        <div id="parts" class="small" hidden></div>
        <button class="btn" id="fav" type="button" style="width:100%;margin-top:10px">☆ 收藏</button>
        <p class="small" style="margin:10px 0 0"><a href="#" id="report">投诉 / 申请下架</a> · <a href="#" id="suggestmove" title="放错课程了？选出正确的课程，审核员确认后移过去">建议换个分类</a></p>
      </section>
      <section class="card series-card" id="series" hidden></section>
      <section class="card" id="manage" hidden></section>
    </aside>
  </div>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/resource.js"></script>
</body>
</html>
