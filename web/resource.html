<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资料 · XMUHub</title>
<meta name="description" content="XMUHub 厦门大学学生资料共享平台：按课程整理的往年试卷、笔记、课件，免费下载与分享。">
<meta name="theme-color" content="#122e66">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="browse">
<header id="top" class="top"></header>
<main><div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div class="layout-side">
    <div class="stack">
    <section class="card">
      <h1 id="title" style="overflow-wrap:anywhere">加载中…</h1>
      <p id="subtitle" class="muted" style="margin:-4px 0 12px;overflow-wrap:anywhere" hidden></p>
      <div class="row small muted" id="tags" style="margin-bottom:14px"></div>
      <div id="notice"></div>
      <p id="note" class="muted" style="white-space:pre-wrap" hidden></p>
      <dl class="kv" id="kv"></dl>
    </section>
    <section class="card" id="pvcard"><div class="row"><h2 style="margin:0">在线预览</h2><span class="grow"></span><button class="btn sm" id="pvgo" type="button">加载预览</button></div>
      <div id="pv" style="margin-top:12px"><p class="small muted">支持 PDF、Word、PPT、Excel、图片、文本代码、电子书，压缩包可以看里面的文件；手机上也能看。经国内镜像加载，不计下载次数。</p></div></section>
    <section class="card" id="social">
      <div class="row"><h2 style="margin:0">评分与评论</h2><span class="grow"></span><span id="ravg" class="small muted"></span></div>
      <div class="row" style="margin:10px 0"><span class="small">我的评分</span><span class="rate" id="rate"></span><span class="small faint" id="ratehint"></span></div>
      <form id="cf"><textarea class="input" id="cbody" maxlength="500" rows="3" placeholder="说说这份资料怎么样：是否完整、答案对不对、适合哪位老师的课…"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn primary sm">发表评论</button><span class="small faint" id="chint"></span></div></form>
      <div id="clist" style="margin-top:12px"></div>
    </section>
    <section class="card" id="history" hidden><h2>审核记录</h2><div id="hlist" class="small"></div></section>
    </div>
    <aside>
      <section class="card">
        <button class="btn primary lg" id="dl" style="width:100%">下载</button>
        <div class="progress" id="dlprog" hidden style="margin-top:12px"><i></i></div>
        <p class="small faint" style="margin:10px 0 0">文件经国内加速镜像下载，不占用本站流量。</p>
        <div id="parts" class="small" hidden></div>
        <p class="small" style="margin:10px 0 0"><a href="#" id="report">投诉 / 申请下架</a></p>
      </section>
      <section class="card" id="manage" hidden></section>
    </aside>
  </div>
</div></main>
<footer id="foot" class="foot"></footer>
<script type="module" src="/assets/pages/resource.js"></script>
</body>
</html>
