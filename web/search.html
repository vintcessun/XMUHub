<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 · 鹭岛书阁</title>
<meta name="description" content="鹭岛书阁是厦门大学学生资料共享平台，按课程整理的往年试卷、笔记、课件，免费下载与分享。">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preload" href="/assets/xmu-campus-background.jpg" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="search">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t)document.getElementById('top').innerHTML=t}catch(e){}</script>
<main><div class="wrap">
  <form class="bigsearch" action="/search" role="search" style="margin:8px 0 18px;max-width:none"><input name="q" id="sq" placeholder="课程名、老师、年份或拼音首字母" aria-label="搜索"><button class="btn primary">搜索</button></form>
  <div class="page-head"><div><h1 id="title">搜索</h1><div class="muted small"><span id="summary"></span> <span id="scope"></span></div></div></div>
  <div class="toolbar"><div class="chips" id="types"></div><span class="grow"></span>
    <select id="within" aria-label="范围"><option value="">全站</option></select>
    <select id="tag" aria-label="资料类型"><option value="">全部类型</option></select></div>
  <div id="results"></div>
  <div class="row" style="justify-content:center;margin-top:16px" id="pager"></div>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/search.js"></script>
</body>
</html>
