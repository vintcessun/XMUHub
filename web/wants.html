<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求资料 · 鹭岛书阁</title>
<meta name="description" content="鹭岛书阁是厦门大学学生资料共享平台，按课程整理的往年试卷、笔记、课件，免费下载与分享。">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/logo.png" type="image/png">
<link rel="preload" href="/assets/xmu-campus-background.jpg" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="wants">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t){document.getElementById('top').innerHTML=t;document.documentElement.classList.add('seen')}}catch(e){}</script>
<main><div class="wrap" style="max-width:860px">
  <div class="page-head"><div><h1>求资料</h1><div class="muted small">找不到想要的资料？发一条求助，看到的同学会上传或者告诉你在哪。求助经审核员通过后才公开；请只求学习资料，不要留联系方式，不要买卖。</div></div>
    <div class="row"><button class="btn primary" id="newbtn" type="button">发求助</button></div></div>
  <div id="compose"></div>
  <div class="chips" id="tabs" style="margin-bottom:12px"><button class="chip on" data-s="open" type="button">求助中</button><button class="chip" data-s="found" type="button">已找到</button><button class="chip" data-s="mine" type="button" hidden>我发的</button></div>
  <div id="nodefilter"></div>
  <section class="card"><div class="list" id="wants"><div class="skeleton"></div></div></section>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/wants.js"></script>
</body>
</html>
